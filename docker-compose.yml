version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cyberguardian_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cyberguardian
      MYSQL_USER: cg_user
      MYSQL_PASSWORD: cg_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: cyberguardian_redis
    ports:
      - "6379:6379"

volumes:
  db_data:
